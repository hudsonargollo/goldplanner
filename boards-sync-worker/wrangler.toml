name = "goldplanner-boards-sync"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "cb27e1a67198789eb42d11ab90737652"

[[durable_objects.bindings]]
name = "BOARDS_SYNC"
class_name = "BoardSyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardSyncRoom"]

# Same bucket the REST snapshot endpoints (functions/api/boards/[[path]].js)
# read/write — this DO writes directly, no round-trip through the main Worker.
[[r2_buckets]]
binding = "BOARDS_DATA"
bucket_name = "goldplanner-boards-data"
