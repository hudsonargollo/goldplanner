# Standalone redirector for go.goldplanner.clubemkt.digital — Gold Planner's own short-link
# domain, kept separate from Código Internacional's links.goldplanner.clubemkt.digital
# (a different, unrelated business already live on that subdomain). See
# ~/.claude/plans/clever-crunching-raccoon.md, Phase D.
#
# Deploy:
#   cd worker-links && npx wrangler deploy

name = "goldplanner-wa-links-redirect"
main = "./src/index.js"
compatibility_date = "2024-11-01"
account_id = "cb27e1a67198789eb42d11ab90737652"

routes = [
  { pattern = "go.goldplanner.clubemkt.digital", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "hub-goldplanner"
database_id = "305d34fb-a525-45e2-9eb0-67ef552a45b8"
