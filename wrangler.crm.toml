# Workers deployment target for the goldplanner.clubemkt.digital/crm API (see
# worker/crm-entry.js) — Hono routes for leads/sales/commissions/wa-links/
# dashboard, RBAC-gated via worker/lib/crmRbac.js. Auth API routes delegate
# to the same compiled backend as goldplanner-hub/goldplanner-portal.
#
# The CRM no longer has its own standalone frontend — Dashboard/Pipeline/
# Vendas/Links now live inside the Hub app as panels (src/crm/CrmPanel.jsx,
# src/crm/CrmWaLinks.jsx, wired in src/App.jsx), which call this Worker's
# /crm/api/* routes directly (see src/crm/crmApi.js — hardcoded to /crm
# regardless of which bundle it's compiled into). Any direct GET to /crm
# 302s to /hub instead of serving a page (crm-entry.js's catch-all), so
# no [assets] binding/static build is needed here anymore.
#
# Build before deploying:
#   npm run build && npx wrangler pages functions build --outdir=./dist/_worker.js/
# Deploy:
#   npx wrangler deploy --config wrangler.crm.toml

name = "goldplanner-crm"
main = "./worker/crm-entry.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "cb27e1a67198789eb42d11ab90737652"

routes = [
  # See wrangler.worker.toml's comment — "/crm/*" alone doesn't match a bare
  # "/crm" with no trailing slash.
  { pattern = "goldplanner.clubemkt.digital/crm", zone_name = "clubemkt.digital" },
  { pattern = "goldplanner.clubemkt.digital/crm/*", zone_name = "clubemkt.digital" },
]

[[kv_namespaces]]
binding = "KANBAN"
id = "7ca7e269f18f4b938f505883b0933e1c"

[[d1_databases]]
binding = "DB"
database_name = "hub-goldplanner"
database_id = "305d34fb-a525-45e2-9eb0-67ef552a45b8"

[vars]
TASKS_BACKEND = "d1"

[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"
script_name = "goldplanner-realtime"
