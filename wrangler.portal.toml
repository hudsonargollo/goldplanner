# Workers deployment target for the goldplanner.clubemkt.digital/portal customer panel
# (see plan: ~/.claude/plans/wise-riding-wirth.md, "Phase 3: Carve /portal
# out of goldplanner-hub"). Separate Worker from goldplanner-hub — independently
# deployable — but shares the same D1/KV/DO bindings and reuses the same
# compiled backend (see worker/portal-entry.js).
#
# Build before deploying:
#   npm run build && npm run build:portal && npx wrangler pages functions build --outdir=./dist/_worker.js/
# Deploy:
#   npx wrangler deploy --config wrangler.portal.toml

name = "goldplanner-portal"
main = "./worker/portal-entry.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "193882a3226d5fb9c3611ea50c95992e"

routes = [
  # See wrangler.worker.toml's comment — "/portal/*" alone doesn't match a
  # bare "/portal" with no trailing slash.
  { pattern = "goldplanner.clubemkt.digital/portal", zone_name = "goldplanner.clubemkt.digital" },
  { pattern = "goldplanner.clubemkt.digital/portal/*", zone_name = "goldplanner.clubemkt.digital" },
]

[assets]
directory = "./dist-portal"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "KANBAN"
id = "b06af75d5fe74e4c83863bf6a36030d0"

[[d1_databases]]
binding = "DB"
database_name = "hub-goldplanner"
database_id = "062719db-dc4e-46c0-a9d9-bdb4fef61a30"

[vars]
TASKS_BACKEND = "d1"

[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"
script_name = "goldplanner-realtime"
